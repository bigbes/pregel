# One master and three workers, each the read-write leader of a replicaset of
# its own. The master loads the graph; the workers need app_cfg all the same,
# because the damping factor and the iteration count are read by the compute
# function through the worker context.

credentials:
  # See examples/max-value/config.yaml for what this section is doing: the
  # credentials role marks the user pregel connects as and carries what that
  # user may do, and the user cannot be called `pregel` as well.
  roles:
    pregel:
      privileges:
        - permissions: [execute]
          lua_call:
            - pregel.worker.deliver
            - pregel.worker.deliver_batch
            - pregel.worker.wait
            - pregel.master.deliver
  users:
    pregel_peer:
      password: 'secret'
      roles: [pregel]

wal:
  mode: none

groups:
  pregel:
    replicasets:
      master:
        instances:
          master:
            iproto:
              listen:
                - uri: '127.0.0.1:3301'
            roles: [pregel.roles.master]
            roles_cfg:
              pregel.roles.master:
                name: pagerank
                app: app
                autostart: true
                workers:
                  - '127.0.0.1:3302'
                  - '127.0.0.1:3303'
                  - '127.0.0.1:3304'
                app_cfg: &app_cfg
                  # Paths are relative to examples/pagerank/ and resolved by
                  # the app module: an instance's own working directory is
                  # under var/lib and is no use as a base.
                  vertices: '../../test/fixtures/graphs/small/pagerank6/vertices.avro'
                  edges: '../../test/fixtures/graphs/small/pagerank6/edges.avro'
                  damping: 0.85
                  iterations: 30
      worker1:
        instances:
          worker1:
            iproto:
              listen:
                - uri: '127.0.0.1:3302'
            roles: [pregel.roles.worker]
            roles_cfg: &worker_cfg
              pregel.roles.worker:
                name: pagerank
                app: app
                master: '127.0.0.1:3301'
                workers:
                  - '127.0.0.1:3302'
                  - '127.0.0.1:3303'
                  - '127.0.0.1:3304'
                # The same table as the master's: the paths are ignored here
                # (this app has no worker_preload) and damping/iterations are
                # ignored there. One anchor beats two lists that can drift.
                app_cfg: *app_cfg
      worker2:
        instances:
          worker2:
            iproto:
              listen:
                - uri: '127.0.0.1:3303'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
      worker3:
        instances:
          worker3:
            iproto:
              listen:
                - uri: '127.0.0.1:3304'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
