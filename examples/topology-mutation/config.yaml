# One master and three workers, each the read-write leader of a replicaset of
# its own. The master loads the graph; the workers need app_cfg for the
# threshold, which the compute function reads through the worker context.

credentials:
  # See examples/max-value/config.yaml for what this section is doing: the
  # credentials role marks the user pregel connects as and carries what that
  # user may do, and the user cannot be called `pregel` as well.
  roles:
    pregel:
      privileges:
        - permissions: [execute]
          lua_call: &pregel_entry_points
            - pregel.worker.deliver
            - pregel.worker.deliver_batch
            - pregel.worker.wait
            - pregel.master.deliver
  users:
    pregel_peer:
      password: 'secret'
      roles: [pregel]

wal:
  mode: none

groups:
  pregel:
    replicasets:
      master:
        instances:
          master:
            iproto:
              listen:
                - uri: '127.0.0.1:3301'
            roles: [pregel.roles.master]
            roles_cfg:
              pregel.roles.master:
                name: topology
                app: app
                autostart: true
                app_cfg: &app_cfg
                  # Relative to examples/topology-mutation/, resolved by the
                  # app module: an instance's own working directory is under
                  # var/lib and is no use as a base.
                  #
                  # Eight vertices, ten edges with weights from 1 to 9, chosen
                  # so that at threshold 5 some vertices keep an edge, some
                  # lose all of theirs, one edge sits exactly on the threshold
                  # and is kept, and one vertex has no out-edges to begin with.
                  graph: '../../test/fixtures/graphs/small/weights8.txt'
                  threshold: 5
      worker1:
        # The read/write half of the privileges, on the replicasets that own
        # the spaces -- see examples/max-value/config.yaml for why it is not
        # global. This job writes to topology_mutation_<job> from inside
        # compute, so the sequence behind it matters here more than anywhere.
        credentials: &worker_credentials
          roles:
            pregel:
              privileges:
                - permissions: [execute]
                  lua_call: *pregel_entry_points
                - permissions: [read, write]
                  spaces:
                    - data_topology
                    - topology_mutation_topology
                    - pregel_tube_mqueue_first_topology
                    - pregel_tube_mqueue_second_topology
                  sequences:
                    - topology_mutation_topology_seq
                    - pregel_tube_mqueue_first_topology_seq
                    - pregel_tube_mqueue_second_topology_seq
        instances:
          worker1:
            iproto:
              listen:
                - uri: '127.0.0.1:3302'
            roles: [pregel.roles.worker]
            roles_cfg: &worker_cfg
              pregel.roles.worker:
                name: topology
                app: app
                app_cfg: *app_cfg
      worker2:
        credentials: *worker_credentials
        instances:
          worker2:
            iproto:
              listen:
                - uri: '127.0.0.1:3303'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
      worker3:
        credentials: *worker_credentials
        instances:
          worker3:
            iproto:
              listen:
                - uri: '127.0.0.1:3304'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
