# One master and three workers, each the read-write leader of a replicaset of
# its own. The master loads the graph and shards it out.

credentials:
  users:
    pregel:
      password: 'secret'
      privileges:
        - permissions: [execute]
          lua_call:
            - pregel.worker.deliver
            - pregel.worker.deliver_batch
            - pregel.worker.wait
            - pregel.master.deliver

wal:
  mode: none

groups:
  pregel:
    replicasets:
      master:
        instances:
          master:
            iproto:
              listen:
                - uri: '127.0.0.1:3301'
            roles: [pregel.roles.master]
            roles_cfg:
              pregel.roles.master:
                name: wcc
                app: app
                autostart: true
                user: pregel
                password: 'secret'
                workers:
                  - '127.0.0.1:3302'
                  - '127.0.0.1:3303'
                  - '127.0.0.1:3304'
                app_cfg:
                  # Relative to examples/wcc/, resolved by the app module: an
                  # instance's own working directory is under var/lib and is no
                  # use as a base.
                  #
                  # The '-bi' fixture, not the plain one: this algorithm needs
                  # every edge present in both directions, because a message
                  # only ever travels along an out-edge. 75879 vertices and
                  # 1017674 edges. Swap in
                  # ../../test/fixtures/graphs/small/components3.txt for nine
                  # vertices in three components.
                  graph: '../../test/fixtures/graphs/soc-Epinions-custom-bi.txt'
      worker1:
        instances:
          worker1:
            iproto:
              listen:
                - uri: '127.0.0.1:3302'
            roles: [pregel.roles.worker]
            roles_cfg: &worker_cfg
              pregel.roles.worker:
                name: wcc
                app: app
                master: '127.0.0.1:3301'
                workers:
                  - '127.0.0.1:3302'
                  - '127.0.0.1:3303'
                  - '127.0.0.1:3304'
                user: pregel
                password: 'secret'
      worker2:
        instances:
          worker2:
            iproto:
              listen:
                - uri: '127.0.0.1:3303'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
      worker3:
        instances:
          worker3:
            iproto:
              listen:
                - uri: '127.0.0.1:3304'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
