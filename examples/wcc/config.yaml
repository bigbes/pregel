# One master and three workers, each the read-write leader of a replicaset of
# its own. The master loads the graph and shards it out.

credentials:
  # See examples/max-value/config.yaml for what this section is doing: the
  # credentials role marks the user pregel connects as and carries what that
  # user may do, and the user cannot be called `pregel` as well.
  roles:
    pregel:
      privileges:
        - permissions: [execute]
          lua_call: &pregel_entry_points
            - pregel.worker.deliver
            - pregel.worker.deliver_batch
            - pregel.worker.wait
            - pregel.master.deliver
  users:
    pregel_peer:
      password: 'secret'
      roles: [pregel]

wal:
  mode: none

groups:
  pregel:
    replicasets:
      master:
        instances:
          master:
            iproto:
              listen:
                - uri: '127.0.0.1:3301'
            roles: [pregel.roles.master]
            roles_cfg:
              pregel.roles.master:
                name: wcc
                app: app
                autostart: true
                app_cfg:
                  # Relative to examples/wcc/, resolved by the app module: an
                  # instance's own working directory is under var/lib and is no
                  # use as a base.
                  #
                  # The '-bi' fixture, not the plain one: this algorithm needs
                  # every edge present in both directions, because a message
                  # only ever travels along an out-edge. 75879 vertices and
                  # 1017674 edges. Swap in
                  # ../../test/fixtures/graphs/small/components3.txt for nine
                  # vertices in three components.
                  graph: '../../test/fixtures/graphs/soc-Epinions-custom-bi.txt'
      worker1:
        # The read/write half of the privileges, on the replicasets that own
        # the spaces -- see examples/max-value/config.yaml for why it is not
        # global. Respecifying `privileges` here replaces the whole list, so
        # the entry points come along through the anchor.
        credentials: &worker_credentials
          roles:
            pregel:
              privileges:
                - permissions: [execute]
                  lua_call: *pregel_entry_points
                - permissions: [read, write]
                  spaces:
                    - data_wcc
                    - topology_mutation_wcc
                    - pregel_tube_mqueue_first_wcc
                    - pregel_tube_mqueue_second_wcc
                  sequences:
                    - topology_mutation_wcc_seq
                    - pregel_tube_mqueue_first_wcc_seq
                    - pregel_tube_mqueue_second_wcc_seq
        instances:
          worker1:
            iproto:
              listen:
                - uri: '127.0.0.1:3302'
            roles: [pregel.roles.worker]
            roles_cfg: &worker_cfg
              pregel.roles.worker:
                name: wcc
                app: app
      worker2:
        credentials: *worker_credentials
        instances:
          worker2:
            iproto:
              listen:
                - uri: '127.0.0.1:3303'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
      worker3:
        credentials: *worker_credentials
        instances:
          worker3:
            iproto:
              listen:
                - uri: '127.0.0.1:3304'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
