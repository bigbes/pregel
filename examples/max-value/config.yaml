# A four-instance pregel cluster: one master and three workers, each the
# read-write leader of a replicaset of its own. The workers are shards of one
# graph, not copies of each other, so nothing here replicates.

credentials:
  roles:
    # The credentials role does two things at once: it marks the user pregel
    # connects to its peers as -- the roles look for the one user carrying it,
    # and take that user's password -- and it carries what that user may do.
    #
    # Everything pregel sends to pregel is a conn:call() on one of these four
    # entry points; there is no universe grant anywhere in the library. The
    # other half of the privileges -- read/write on the job's own spaces -- is
    # on the worker replicasets below, because that is where those spaces are.
    pregel:
      privileges:
        - permissions: [execute]
          lua_call: &pregel_entry_points
            - pregel.worker.deliver
            - pregel.worker.deliver_batch
            - pregel.worker.wait
            - pregel.master.deliver
  users:
    # Not called `pregel`: a credentials role and a user share one namespace,
    # and the applier then dies with "User 'pregel' already exists" before any
    # role is applied.
    pregel_peer:
      password: 'secret'
      roles: [pregel]

# Nothing in an example outlives the cluster, and a graph load writes every
# vertex once: keeping it out of the WAL is most of the load time.
wal:
  mode: none

groups:
  pregel:
    replicasets:
      master:
        instances:
          master:
            iproto:
              listen:
                - uri: '127.0.0.1:3301'
            roles: [pregel.roles.master]
            roles_cfg:
              pregel.roles.master:
                name: maxvalue
                app: app
                # Run the job as soon as every worker has reported in. Without
                # this the cluster comes up idle and waits for an operator --
                # see the README.
                autostart: true
                app_cfg:
                  # Relative to examples/max-value/, resolved by the app
                  # module: an instance's own working directory is under
                  # var/lib and is no use as a base.
                  #
                  # The real thing: 75879 vertices and 508837 edges, which the
                  # master loads in under a second and the cluster chews
                  # through in twelve supersteps. Swap in
                  # ../../test/fixtures/graphs/small/ring10.txt for a
                  # ten-vertex graph whose answer can be read at a glance.
                  graph: '../../test/fixtures/graphs/soc-Epinions-custom.txt'
      worker1:
        # The job's own spaces. A lua_call runs with the caller's privileges
        # and the entry points above write, so the pregel user needs these as
        # well -- and they are granted here, on the replicasets that create
        # them, rather than globally: the master never creates them, and an
        # instance whose config grants read/write on an object that never
        # appears warns about it for ever and reports
        # config:info().status = 'check_warnings'.
        #
        # The spaces are named after the job and do not exist when the
        # credentials applier first runs; it grants them a few milliseconds
        # after the worker role creates them, from its own on_replace trigger
        # on _space and _sequence.
        #
        # Respecifying `privileges` at a narrower scope replaces the whole
        # list, so the entry points come along through the anchor.
        credentials: &worker_credentials
          roles:
            pregel:
              privileges:
                - permissions: [execute]
                  lua_call: *pregel_entry_points
                - permissions: [read, write]
                  spaces:
                    - data_maxvalue
                    - topology_mutation_maxvalue
                    - pregel_tube_mqueue_first_maxvalue
                    - pregel_tube_mqueue_second_maxvalue
                  # data_<job> has a string primary key and therefore no
                  # sequence; the other three are sequence-backed.
                  sequences:
                    - topology_mutation_maxvalue_seq
                    - pregel_tube_mqueue_first_maxvalue_seq
                    - pregel_tube_mqueue_second_maxvalue_seq
        instances:
          worker1:
            iproto:
              listen:
                - uri: '127.0.0.1:3302'
            roles: [pregel.roles.worker]
            roles_cfg: &worker_cfg
              pregel.roles.worker:
                name: maxvalue
                app: app
      worker2:
        credentials: *worker_credentials
        instances:
          worker2:
            iproto:
              listen:
                - uri: '127.0.0.1:3303'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
      worker3:
        credentials: *worker_credentials
        instances:
          worker3:
            iproto:
              listen:
                - uri: '127.0.0.1:3304'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
