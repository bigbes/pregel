# One master and three workers, each the read-write leader of a replicaset of
# its own. Unlike the graph examples, both Avro files are read by *every*
# worker (worker_preload), each keeping the vertices whose names hash to it --
# so app_cfg has to reach the workers as well as the master, and the anchor
# below is what keeps the two copies from drifting.

credentials:
  # See examples/max-value/config.yaml for what this section is doing: the
  # credentials role marks the user pregel connects as and carries what that
  # user may do, and the user cannot be called `pregel` as well.
  #
  # This example's own spaces are not here and cannot be: they are named after
  # the tasks in labels.avro, which nobody knows until the file is read. The
  # app module creates them and grants them itself, to the user the roles hand
  # it in the job context.
  roles:
    pregel:
      privileges:
        - permissions: [execute]
          lua_call: &pregel_entry_points
            - pregel.worker.deliver
            - pregel.worker.deliver_batch
            - pregel.worker.wait
            - pregel.master.deliver
  users:
    pregel_peer:
      password: 'secret'
      roles: [pregel]

# Nothing in an example outlives the cluster. The per-task training spaces are
# `temporary` in their own right, so they would stay out of the WAL even here.
wal:
  mode: none

groups:
  pregel:
    replicasets:
      master:
        instances:
          master:
            iproto:
              listen:
                - uri: '127.0.0.1:3301'
            roles: [pregel.roles.master]
            roles_cfg:
              pregel.roles.master:
                name: lookalike
                app: app
                # Run the job as soon as every worker has reported in. Without
                # this the cluster comes up idle and waits for an operator --
                # see the README.
                autostart: true
                app_cfg: &app_cfg
                  # Relative to examples/lookalike/, resolved by the app
                  # module: an instance's own working directory is under
                  # var/lib and is no use as a base.
                  #
                  # The committed fixture: 200 users, 8 features, 2 tasks with
                  # 60 labels each. `tools/gen-lookalike.lua` writes a bigger
                  # one -- the README runs 2000 users, 16 features, 3 tasks.
                  users:  '../../test/fixtures/lookalike/users.avro'
                  labels: '../../test/fixtures/lookalike/labels.avro'
                  # Must name the user the credentials role marks. This example
                  # is the only one that keeps spaces of its own -- one per
                  # task, for the staged training set -- and a compute function
                  # runs with the privileges of whoever called the RPC it is
                  # inside. `credentials.roles.pregel` cannot name these spaces
                  # (they are called after the tasks in labels.avro); an app
                  # module cannot read the cluster config; so the name is here.
                  grant_to: pregel_peer
                  # Held out of training, per class, to measure AUC on.
                  test_fraction: 0.25
                  # A task with fewer labels than this reports `failed` with a
                  # reason instead of training on nothing.
                  min_labels: 20
                  # Minibatch SGD on the hinge loss with an L2 penalty, and an
                  # inverse-decay rate of 0.1 / (1 + 0.01 * iteration).
                  learning_rate: 0.1
                  learning_decay: 0.01
                  lambda: 0.001
                  batch_size: 16
                  max_iter: 300
                  alpha: 0.2
                  epsilon: 0.00001
                  # Users asked for a raw score, and the width of one bucket of
                  # the percentile scale built out of their answers.
                  calibration_sample: 100
                  calibration_bucket: 5
      worker1:
        # The read/write half of the privileges, on the replicasets that own
        # the spaces -- see examples/max-value/config.yaml for why it is not
        # global. Respecifying `privileges` here replaces the whole list, so
        # the entry points come along through the anchor. The app's own
        # per-task spaces are not here: it grants those itself, once it knows
        # their names.
        credentials: &worker_credentials
          roles:
            pregel:
              privileges:
                - permissions: [execute]
                  lua_call: *pregel_entry_points
                - permissions: [read, write]
                  spaces:
                    - data_lookalike
                    - topology_mutation_lookalike
                    - pregel_tube_mqueue_first_lookalike
                    - pregel_tube_mqueue_second_lookalike
                  sequences:
                    - topology_mutation_lookalike_seq
                    - pregel_tube_mqueue_first_lookalike_seq
                    - pregel_tube_mqueue_second_lookalike_seq
        instances:
          worker1:
            iproto:
              listen:
                - uri: '127.0.0.1:3302'
            roles: [pregel.roles.worker]
            roles_cfg: &worker_cfg
              pregel.roles.worker:
                name: lookalike
                app: app
                # The same table as the master's, and here it is load-bearing
                # on both sides: the workers read the Avro files (the master
                # has no loader at all) and every hyperparameter is read by a
                # compute function through the worker context.
                app_cfg: *app_cfg
      worker2:
        credentials: *worker_credentials
        instances:
          worker2:
            iproto:
              listen:
                - uri: '127.0.0.1:3303'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
      worker3:
        credentials: *worker_credentials
        instances:
          worker3:
            iproto:
              listen:
                - uri: '127.0.0.1:3304'
            roles: [pregel.roles.worker]
            roles_cfg: *worker_cfg
